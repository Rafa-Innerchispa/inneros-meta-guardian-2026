name: offline-demo-tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify self-heal browser JavaScript syntax
        run: node --check src/inneros_meta_guardian/static/self-heal.js
      - name: Compile Python sources without external integrations
        run: python -m compileall -q src/inneros_meta_guardian
      - name: Test without paid services
        env:
          PYTHONPATH: src
          ALLOW_EXTERNAL_META: 'false'
        run: python -m unittest discover -s tests -v
      - name: Audit safe open-source candidate
        run: python scripts/build_public_release.py --check
      - name: Package clean-history candidate (Python 3.12 only)
        if: matrix.python-version == '3.12'
        run: python scripts/build_public_release.py --output dist/inneros-meta-open-source-candidate.zip
      - name: Preserve clean-history ZIP as private artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: inneros-meta-public-source-candidate
          path: dist/inneros-meta-open-source-candidate.zip
          if-no-files-found: error
          retention-days: 7
