name: offline-demo-tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify self-heal browser JavaScript syntax
        run: node --check src/inneros_meta_guardian/static/self-heal.js
      - name: Compile Python sources without external integrations
        run: python -m compileall -q src/inneros_meta_guardian
      - name: Test without paid services
        env:
          PYTHONPATH: src
          ALLOW_EXTERNAL_META: 'false'
        run: python -m unittest discover -s tests -v
